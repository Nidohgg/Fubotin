<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fubotin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--FIN BOOTSTRAP-->
    <link rel="stylesheet" href="./css/styles.css">    
</head>
<body>
    <header>
        <div class="navbar navbar-expand-lg navbar-fubotin" >
            <div class="container-fluid">
                <div>
                    <a class="navbar-brand" href="#">FUBOTÍN</a>
                    <h6>Los botines que buscas en un solo lugar.</h6>
                </div>
                <!--ICONO CARRITO-->
                <div class="pre-Carrito" id="btnCarrito">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="contadorProd" id="contadorProd">0</span><!-- Contador de productos en el carrito -->
                </div>
            </div>
            <!--TENGO QUE AGREGAR PREVISUALIZACION QUE AL CLIQUEAR EL CARRITO MUESTRE LA LISTA DE PRODUCTOS SELECCIONADOS-->
            <!--CON BOTON DE IR AL CARRITO O CONTINUAR COMPRANDO-->
        </div>
    </header>
    <aside class="carrito-previo" id="carrito-previo">
        
        <div class="d-flex justify-content-between align-items-center ">
            <h2 class="mb-0zz">Mi carrito</h2>
            <button type="button" class="btn-close" id="cerrar-carrito" aria-label="Cerrar"></button>
        </div>

        <div id="lista-carrito">
            <!--SE CARGAN LOS PRODUCTOS DESDE JS-->
        </div>

        <div class="carrito-footer">
            <button id="btn-vaciar-carrito">
                Vaciar carrito
            </button>
            <a href="./paginas/carrito.html" class="btn-comprar">
                Avanzar con la compra
            </a>
        </div>

    </aside>
    <main class="d-flex flex-column align-items-center">
        <!--AGREGAR IMAGENES TIPO SLIDE A MODO DE PRESENTACION-->
        <div class="slider">
        </div>

        <div>
            <div class="d-flex justify-content-center mt-3 mb-3">
                <search class="barraBusqueda col-sm-9 p3">
                    <input class="form-control " type="search" id="inputBusqueda" placeholder="Buscar botín..." aria-label="Search">
                </search>
            </div>

            <div class="categorias mb-3">
                <!--CATEGORIAS DE LOS BOTINES-->
            </div>
        </div>

        <article class="card-container card-group mb-5 g-4">
            <!--CARDS DE BOTINES/PRODUCTOS-->
        </article>

    </main>
    <footer>
        <div class="">
            <h4>© 2024 Fubotin. Todos los derechos reservados.</h4>
        </div>
    </footer>
    <!--SCRIPTS DE JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/carrito.js"></script>
    
</body>
</html>
