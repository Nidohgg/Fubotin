<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fubotin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">    
</head>
<body>
    <header>
        <div class="header">
            <div class="titulo">
                <h1>FUBOTÍN</h1>
                <h3>Los botines que buscas en un solo lugar.</h3>
            </div>
            <!--ICONO CARRITO-->
            <div class="pre-Carrito" id="btnCarrito">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="contadorProd" id="contadorProd">0</span><!-- Contador de productos en el carrito -->
            </div>

            <!--TENGO QUE AGREGAR PREVISUALIZACION QUE AL CLIQUEAR EL CARRITO MUESTRE LA LISTA DE PRODUCTOS SELECCIONADOS-->
            <!--CON BOTON DE IR AL CARRITO O CONTINUAR COMPRANDO-->
        </div>
    </header>
    <aside class="carrito-previo" id="carrito-previo">
        
        <div class="carrito-header">
            <h2>Mi carrito</h2>
            <button id="cerrar-carrito">X</button>
        </div>

        <div id="lista-carrito">
            <!--SE CARGAN LOS PRODUCTOS DESDE JS-->
        </div>

        <div class="carrito-footer">
            <button id="btn-vaciar-carrito">
                Vaciar carrito
            </button>
            <a href="./paginas/carrito.html" class="btn-comprar">
                Avanzar con la compra
            </a>
        </div>

    </aside>
    <main>
        <!--AGREGAR IMAGENES TIPO SLIDE A MODO DE PRESENTACION-->
        <div class="slider">
        </div>

        <article><!--AGREGAR ESTILOS-->
            <search class="barraBusqueda">
                <input type="search" id="inputBusqueda" placeholder="Buscar botín...">
            </search>
        </article>

        <article class="categorias">
            <!--CATEGORIAS DE LOS BOTINES-->
        </article>

        <article class="card-container">
            <!--CARDS DE BOTINES/PRODUCTOS-->
        </article>

    </main>
    <footer>
        <div class="foot">
            <h4>© 2024 Fubotin. Todos los derechos reservados.</h4>
        </div>
    </footer>
    <!--SCRIPTS DE JS-->
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/carrito.js"></script>
    
</body>
</html>
